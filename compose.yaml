name: 13xfile-local

services:
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped

  feed:
    build:
      context: .
      dockerfile: feed/Dockerfile
    ports:
      - "127.0.0.1:8081:80"
    restart: unless-stopped

  share:
    build:
      context: .
      dockerfile: share/Dockerfile
    ports:
      - "127.0.0.1:8082:80"
    restart: unless-stopped

  ipfs:
    image: ipfs/kubo:v0.43.1
    volumes:
      - feed-ipfs:/data/ipfs
    healthcheck:
      test: ["CMD", "ipfs", "id"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      ADDR: ":8090"
      DATABASE_PATH: "/data/feed.db"
      IPFS_RPC_URL: "http://ipfs:5001"
      FEED_IPNS_KEY: "self"
      CORS_ORIGIN: "*"
    volumes:
      - feed-data:/data
    ports:
      - "127.0.0.1:8090:8090"
    depends_on:
      ipfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/health"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  feed-data:
  feed-ipfs:
